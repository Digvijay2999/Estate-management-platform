<rect x="610" y="475" width="44" height="72" fill="#166FC1"/>
<rect x="610" y="560" width="44" height="72" fill="#1358A8"/>

<!-- Right building -->
<path d="M720 830 L720 480 L805 410 L915 505 L915 860 Z" fill="#173D7A"/>
<path d="M750 500 L805 455 L885 520 L885 555 L805 490 L750 535 Z" fill="url(#silver)"/>
