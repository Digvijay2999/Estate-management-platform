<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#132E5B"/>
    <stop offset="55%" stop-color="#07152E"/>
    <stop offset="100%" stop-color="#102754"/>
  </linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#35E1E5"/>
    <stop offset="50%" stop-color="#1976D2"/>
    <stop offset="100%" stop-color="#103B9A"/>
  </linearGradient>
  <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#FFE66B"/>
    <stop offset="45%" stop-color="#FF9D00"/>
    <stop offset="100%" stop-color="#FF3B00"/>
  </linearGradient>
  <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#2F9E00"/>
    <stop offset="50%" stop-color="#B6F000"/>
    <stop offset="100%" stop-color="#FFB800"/>
  </linearGradient>
  <linearGradient id="silver" x1="0" y1="0" x2="0.8" y2="1">
    <stop offset="0%" stop-color="#FFFFFF"/>
    <stop offset="50%" stop-color="#F0F3F7"/>
    <stop offset="100%" stop-color="#A9B3C1"/>
  </linearGradient>
</defs>

<!-- Background -->
<rect x="20" y="20" width="1160" height="1160" rx="170" fill="url(#bg)"/>

<!-- Outer arcs -->
<path d="M235 860 A470 470 0 0 1 548 235" fill="none" stroke="url(#blue)" stroke-width="64" stroke-linecap="round"/>
<path d="M655 235 A470 470 0 0 1 975 860" fill="none" stroke="url(#warm)" stroke-width="64" stroke-linecap="round"/>

<!-- Left building -->
<path d="M330 875 L330 555 L475 440 L530 485 L530 760 Z" fill="#123D7B"/>
<path d="M355 845 L355 585 L430 525 L430 790 Z" fill="#071B40"/>
