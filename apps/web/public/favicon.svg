<!-- House roof -->
<path d="M220 1000 L600 650 L980 1000 L880 950 L600 720 L320 950 Z" fill="url(#silver)"/>
<path d="M290 1000 L600 720 L910 1000 Z" fill="#06142D"/>
<path d="M570 720 L600 690 L630 720 L630 760 L600 735 L570 760 Z" fill="url(#blue)"/>

<!-- House window -->
<rect x="552" y="805" width="48" height="48" rx="2" fill="#FFD84A"/>
<rect x="615" y="805" width="48" height="48" rx="2" fill="#FFD84A"/>
<rect x="552" y="868" width="48" height="48" rx="2" fill="#FFB300"/>
<rect x="615" y="868" width="48" height="48" rx="2" fill="#FFB300"/>

